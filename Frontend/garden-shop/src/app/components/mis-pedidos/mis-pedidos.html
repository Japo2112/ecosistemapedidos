<app-navbar />

<div class="d-flex">
  <app-sidebar />

  <div class="flex-grow-1 p-4">

    <h2 class="text-garden mb-4">
      <i class="bi bi-bag me-2"></i>Mis Pedidos
    </h2>

    @if (cargando) {
      <div class="text-center py-5">
        <div class="spinner-border text-garden"></div>
      </div>
    } @else {
      <div class="card-garden overflow-hidden">
        <table class="table table-garden mb-0">
          <thead>
            <tr>
              <th>#</th>
              <th>Fecha</th>
              <th>Total</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            @for (p of pedidos; track p.id_pedido) {
              <tr>
                <td>{{ p.id_pedido }}</td>
                <td>{{ p.creado_en }}</td>
                <td class="text-garden fw-bold">Q{{ p.total }}</td>
                <td>
                  <span class="badge" [class]="getBadgeClass(p.estado)">
                    {{ p.estado }}
                  </span>
                </td>
                <td>
                  <button class="btn btn-sm btn-outline-info" (click)="verDetalle(p)">
                    <i class="bi bi-eye me-1"></i>Ver detalle
                  </button>
                </td>
              </tr>
            } @empty {
              <tr>
                <td colspan="5" class="text-center text-secondary py-5">
                  <i class="bi bi-bag-x fs-1 d-block mb-3"></i>
                  No tienes pedidos aún.
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }

  </div>
</div>
